<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Segoe UI, -apple-system, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2233"/>
      <stop offset="0.6" stop-color="#12151f"/>
      <stop offset="1" stop-color="#0d1017"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#4f6bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hIcon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6bff"/>
      <stop offset="1" stop-color="#6b3fff"/>
    </linearGradient>
    <filter id="menuShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="url(#bg)"/>
  <rect width="1000" height="520" fill="url(#glow1)"/>
  <rect width="1000" height="520" fill="url(#glow2)"/>

  <!-- 左侧文案 -->
  <text x="60" y="118" fill="#e8ecf5" font-size="31" font-weight="650" letter-spacing="-0.4">右键托盘图标</text>
  <text x="60" y="162" fill="#7aa2ff" font-size="31" font-weight="650" letter-spacing="-0.4">多一个「重启」</text>

  <text x="60" y="212" fill="#9aa3b5" font-size="14">改完插件、改完配置，不用去任务管理器找进程。</text>
  <text x="60" y="236" fill="#9aa3b5" font-size="14">点一下，应用自己回来。</text>

  <g font-size="11.5" fill="#aab3c5">
    <rect x="60" y="262" width="74" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="97" y="278" text-anchor="middle">Windows</text>
    <rect x="142" y="262" width="106" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="195" y="278" text-anchor="middle">一行命令安装</text>
    <rect x="256" y="262" width="106" height="24" rx="12" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="309" y="278" text-anchor="middle">不装额外环境</text>
  </g>

  <!-- 指示箭头 -->
  <path d="M470 296 C512 292 558 298 594 314" fill="none" stroke="#7aa2ff" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 5"/>
  <path d="M586 304 L600 314 L586 324" fill="none" stroke="#7aa2ff" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 任务栏 -->
  <rect x="0" y="468" width="1000" height="52" fill="#202024" fill-opacity="0.9"/>
  <rect x="0" y="468" width="1000" height="1" fill="#ffffff" fill-opacity="0.07"/>

  <g fill="#ffffff" fill-opacity="0.06">
    <rect x="432" y="477" width="34" height="34" rx="7"/>
    <rect x="478" y="477" width="34" height="34" rx="7"/>
    <rect x="524" y="477" width="34" height="34" rx="7"/>
  </g>
  <g stroke="#cfd3dc" stroke-opacity="0.7" stroke-width="1.6" fill="none">
    <g transform="translate(441,486)">
      <rect x="0" y="0" width="6" height="6" rx="1"/><rect x="10" y="0" width="6" height="6" rx="1"/>
      <rect x="0" y="10" width="6" height="6" rx="1"/><rect x="10" y="10" width="6" height="6" rx="1"/>
    </g>
    <g transform="translate(487,487)"><rect x="0" y="0" width="16" height="13" rx="2"/><path d="M0 4h16"/></g>
    <g transform="translate(533,487)"><rect x="0" y="0" width="16" height="13" rx="2"/><path d="M4 5h8"/></g>
  </g>

  <!-- 托盘图标 -->
  <g transform="translate(936,477)">
    <rect width="34" height="34" rx="8" fill="url(#hIcon)"/>
    <rect width="34" height="34" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="17" cy="16" r="6.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-dasharray="30 12" transform="rotate(-40 17 16)"/>
    <circle cx="24" cy="24" r="2.4" fill="#ffffff"/>
  </g>

  <!-- 右键菜单 -->
  <g filter="url(#menuShadow)">
    <rect x="648" y="236" width="316" height="152" rx="11" fill="#f7f8fa"/>
    <rect x="648" y="236" width="316" height="152" rx="11" fill="none" stroke="#000" stroke-opacity="0.18"/>
  </g>

  <!-- 打开 -->
  <g transform="translate(660,246)">
    <rect width="292" height="36" rx="6" fill="none"/>
    <g transform="translate(12,11)" stroke="#1a1a1f" stroke-opacity="0.62" stroke-width="1.5" fill="none">
      <rect x="0" y="2" width="14" height="11" rx="1.5"/><path d="M0 6h14"/>
    </g>
    <text x="42" y="23" fill="#1a1a1f" font-size="13.5">打开 DeepSeek Harness</text>
  </g>

  <rect x="668" y="288" width="276" height="1" fill="#000" fill-opacity="0.1"/>

  <!-- 重启（新增，高亮） -->
  <g transform="translate(660,296)">
    <rect width="292" height="36" rx="6" fill="#2f6bff" fill-opacity="0.13"/>
    <g transform="translate(11,10)" stroke="#1d4ed8" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 8a6 6 0 1 1-1.9-4.4"/>
      <path d="M14 2v3.8h-3.8"/>
    </g>
    <text x="42" y="23" fill="#1d4ed8" font-size="13.5" font-weight="600">重启</text>
    <rect x="252" y="8" width="34" height="19" rx="4" fill="#2f6bff"/>
    <text x="269" y="21.5" fill="#ffffff" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="0.4">NEW</text>
  </g>

  <!-- 退出 -->
  <g transform="translate(660,338)">
    <rect width="292" height="36" rx="6" fill="none"/>
    <g transform="translate(12,11)" stroke="#6b6b76" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 1.5H4.5A1.5 1.5 0 0 0 3 3v10a1.5 1.5 0 0 0 1.5 1.5H6"/>
      <path d="M10 5l3 3-3 3"/><path d="M13 8H6"/>
    </g>
    <text x="42" y="23" fill="#6b6b76" font-size="13.5">退出 DeepSeek Harness</text>
  </g>
</svg>
